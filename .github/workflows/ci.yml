# Lab 5 · CI pipeline for the course API.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Lint
        run: npm run lint

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Unit tests (no database)
        run: npm test

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_DB: todo
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U todo -d todo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: todo
      DB_NAME: todo
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      PORT: 5000
      API_URL: http://localhost:5000
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Start the API from source (not the image)
        run: node server.js > server.log 2>&1 &
      - name: Wait until the API answers from the database
        run: >-
          curl --silent --show-error --fail
          --retry 30 --retry-delay 1 --retry-all-errors
          "$API_URL/api/todos"
      - name: Integration tests
        run: npm run test:integration
      - name: "On failure: the API log"
        if: failure()
        run: cat server.log
      - name: "On failure: the database log"
        if: failure()
        run: docker logs "${{ job.services.db.id }}"

  image:
    name: image
    needs: [lint, unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name in lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR (main only)
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, and push from main only
        uses: docker/build-push-action@v7
        with:
          context: api
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
