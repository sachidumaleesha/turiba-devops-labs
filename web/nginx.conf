# web/nginx.conf: nginx serves the page and forwards everything under /api/ to the API.
server {
    listen 80;
    root /usr/share/nginx/html;          # index.html, app.js

    location /api/ {
        # Lab 4, step 2.4: which service name, and which container port? (slides 24, 35)
        proxy_pass http://api:5000;
    }
}
